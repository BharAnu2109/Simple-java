# Database Configuration
spring.datasource.url=jdbc:h2:mem:bankingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Application Configuration
server.port=8080
spring.application.name=Banking Application

# Logging
logging.level.com.banking=DEBUG
logging.level.org.springframework.security=DEBUG

# Banking Configuration
banking.interest.savings.rate=0.025
banking.interest.checking.rate=0.001
banking.transaction.daily.limit=10000.00
banking.transfer.minimum.amount=0.01
banking.transfer.maximum.amount=50000.00