apiVersion: v1
kind: Namespace
metadata:
  name: hotel-management
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-config
  namespace: hotel-management
data:
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
  SPRING_CLOUD_CONFIG_URI: "http://config-server:8888"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/hoteldb"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
---
apiVersion: v1
kind: Secret
metadata:
  name: hotel-secrets
  namespace: hotel-management
type: Opaque
data:
  postgres-username: aG90ZWxfdXNlcg== # hotel_user
  postgres-password: aG90ZWxfcGFzc3dvcmQ= # hotel_password